name: release

on:
  push:
    tags: ['v*']
  # Also runnable from the Actions tab: type the version tag (e.g. v1.0.1) and the release creates it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  PROJECT: QuickLaunch.csproj
  ZIP_NAME: quick-launch.zip
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Notch.Core.dll is not on NuGet, so build it from the Notch source. v0.7.0 is the first
      # release with plugin API 5 (what plugin.json asks for), so the plugin runs on 0.7.0 and later.
      - uses: actions/checkout@v4
        with:
          repository: Brick-Bread/WNotch
          ref: v0.7.0
          path: notch
      - run: dotnet build notch/src/Notch.Core -c Release -o notch-core

      - run: dotnet publish $env:PROJECT -c Release -o dist -p:NotchCorePath=${{ github.workspace }}\notch-core\Notch.Core.dll
        shell: pwsh

      - name: Zip and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Remove-Item dist\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath $env:ZIP_NAME
          gh release create $env:TAG $env:ZIP_NAME --title $env:TAG --target $env:GITHUB_SHA --generate-notes
